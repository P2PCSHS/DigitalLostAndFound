name: Deploy

# Deploys to the server every time CI passes on main.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST  hostname or IP of the server
#   DEPLOY_USER  SSH user on the server
#   DEPLOY_KEY   private SSH key for that user (the public half goes in
#                ~/.ssh/authorized_keys on the server)
#   DEPLOY_PATH  absolute path of this repo's clone on the server

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            ./scripts/deploy.sh
