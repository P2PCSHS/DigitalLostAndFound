name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t p2p-lostfound:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name smoke \
            -e FLASK_ENV=production \
            -e SECRET_KEY=ci-not-a-real-secret \
            -e DATABASE_URL=sqlite:////data/app.db \
            -p 8000:8000 p2p-lostfound:ci

          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

          echo "--- health ---"
          curl -sf http://localhost:8000/health

          echo "--- create an item ---"
          curl -sf -X POST http://localhost:8000/items \
            -H 'Content-Type: application/json' \
            -d '{"type":"Keys","description":"ci smoke test"}'

          echo "--- it is listed ---"
          curl -sf http://localhost:8000/items

          echo "--- the page is served ---"
          curl -sf -o /dev/null -w 'index:%{http_code} css:' http://localhost:8000/
          curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:8000/style.css
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke
