<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        select {
            height: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Peak to Peak Lost & Found</h1>
    <select id="search">
        <option value="" disabled selected>Search</option>
        <option value="Backpacks">Backpacks</option>
        <option value="Cell Phones">Cell Phones</option>
        <option value="Chargers">Chargers</option>
        <option value="Glasses">Glasses</option>
        <option value="Gloves/Mittens">Gloves/Mittens</option>
        <option value="Hats">Hats</option>
        <option value="Headphones">Headphones</option>
        <option value="Keys">Keys</option>
        <option value="Jackets/Coats">Jackets/Coats</option>
        <option value="Jewelry/Watches">Jewelry/Watches</option>
        <option value="Lunch Boxes">Lunch Boxes</option>
        <option value="Notebooks">Notebooks</option>
        <option value="Shoes/Boots">Shoes/Boots</option>
        <option value="Sweatshirts/Hoodies">Sweatshirts/Hoodies</option>
        <option value="Water Bottles">Water Bottles</option>
        <option value="Other">Other</option>
    </select>
</header>

<section class="form-section">
    <h2>Add Item</h2>

    <select name="Item Types" id="title">
        <option value="" disabled selected>Item Type</option>
        <option value="Backpacks">Backpacks</option>
        <option value="Cell Phones">Cell Phones</option>
        <option value="Chargers">Chargers</option>
        <option value="Glasses">Glasses</option>
        <option value="Gloves/Mittens">Gloves/Mittens</option>
        <option value="Hats">Hats</option>
        <option value="Headphones">Headphones</option>
        <option value="Keys">Keys</option>
        <option value="Jackets/Coats">Jackets/Coats</option>
        <option value="Jewelry/Watches">Jewelry/Watches</option>
        <option value="Lunch Boxes">Lunch Boxes</option>
        <option value="Notebooks">Notebooks</option>
        <option value="Shoes/Boots">Shoes/Boots</option>
        <option value="Sweatshirts/Hoodies">Sweatshirts/Hoodies</option>
        <option value="Water Bottles">Water Bottles</option>
        <option value="Other">Other</option>
    </select>

    <textarea id="description" placeholder="Description 200 Characters or Less"></textarea>
    <button onclick="addItem()">Add Item</button>
</section>

<section id="items" class="items"></section>
<script src="script.js"></script>
</body>
</html>
